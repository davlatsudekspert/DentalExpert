name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: prototype
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check required secrets
        working-directory: .
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; fi
          done
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Missing secret ASC_KEY_P8"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - name: Native safety checks (case-only file clashes, promises resolved with a plugin)
        run: python3 tools/case_check.py && python3 tools/plugin_guard.py
      - name: Build web assets (bundled, hosted API)
        run: npm run build
        env:
          VITE_API_BASE: https://dental-expert.pages.dev
          # Sign in with Google / Apple (see prototype/OAUTH_SETUP.md): repository variables, or secrets of the same name.
          # Empty values are fine: Google is then hidden; Sign in with Apple shows whenever Google does (guideline 4.8).
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.VITE_GOOGLE_IOS_CLIENT_ID || secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID || secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_APPLE_CLIENT_ID: ${{ vars.VITE_APPLE_CLIENT_ID || secrets.VITE_APPLE_CLIENT_ID }}
      - run: npx cap sync ios
      - name: Write App Store Connect API key (normalised PEM)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          RAW="$ASC_KEY_P8"
          # The secret may be the .p8 text, the .p8 text on one line, only the key body, or base64 of the file.
          if ! printf '%s' "$RAW" | grep -q "BEGIN"; then
            DEC=$(printf '%s' "$RAW" | tr -d ' \r\n' | base64 -D 2>/dev/null || true)
            if printf '%s' "$DEC" | grep -q "BEGIN"; then RAW="$DEC"; fi
          fi
          BODY=$(printf '%s' "$RAW" | tr -d '\r' | sed -E 's/-----(BEGIN|END)[A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid App Store Connect .p8 private key. Re-create the secret from the downloaded AuthKey_XXXX.p8 file (paste the whole file contents)."
            exit 1
          fi
          echo "API key parsed OK (EC/PKCS8)."
      - name: Google Sign-In URL scheme (reversed iOS client id)
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.VITE_GOOGLE_IOS_CLIENT_ID || secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: |
          # 1234-abc.apps.googleusercontent.com -> com.googleusercontent.apps.1234-abc (registered in Info.plist via $(GOOGLE_IOS_URL_SCHEME)).
          ID=$(printf '%s' "$GOOGLE_IOS_CLIENT_ID" | tr -d ' \r\n')
          if [ -n "$ID" ]; then
            SCHEME="com.googleusercontent.apps.${ID%.apps.googleusercontent.com}"
          else
            SCHEME="uz.dentalexpert.app.google-unset"
          fi
          echo "GOOGLE_IOS_URL_SCHEME=$SCHEME" >> "$GITHUB_ENV"
      - name: Archive (unsigned; signing happens at export with a distribution profile, no registered device needed)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            GOOGLE_IOS_URL_SCHEME="$GOOGLE_IOS_URL_SCHEME" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive
      - name: Carry the Sign in with Apple entitlement into the unsigned archive
        run: |
          # An unsigned archive has no entitlements, and export re-signs with the entitlements it finds in the app.
          # Ad-hoc sign the archived app with App.entitlements so export keeps com.apple.developer.applesignin.
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -mindepth 1 -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q com.apple.developer.applesignin \
            || { echo "::error::Sign in with Apple entitlement missing from the archive"; exit 1; }
          echo "Entitlement present."
      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # -allowProvisioningUpdates lets Xcode refresh the App Store profile so it includes Sign in with Apple.
          # The App ID uz.dentalexpert.app must have "Sign In with Apple" ticked in the Apple Developer portal
          # (Identifiers), otherwise export fails with a profile/entitlement mismatch. See OAUTH_SETUP.md.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
