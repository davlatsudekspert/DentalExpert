name: Checks

# The guard on every push: build, type checks, content and native safety checks, unit tests, the local API suites
# (auth, admin, classroom, teacher–student tests v2, topic tests, QR joins, Google/Apple sign-in) and the browser walks.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Native safety checks
        run: python3 tools/case_check.py && python3 tools/plugin_guard.py
      - name: Photo credits (every bundled image credited, allowed licences, size caps, alt text)
        run: python3 tools/photo_credits_check.py
      - name: Curriculum is valid and the generated files are up to date
        run: |
          python3 tools/curriculum.py
          python3 tools/curriculum.py build
          git diff --exit-code -- src/curriculum functions/_lib/curriculumKeys.ts
          python3 tools/question_audit.py --quiet
      - name: Attestation question data (4 options, keys, unique ids, counts, src vs cleaned numbers/units/negations, no review question served)
        run: python3 tools/attestation_check.py
      - name: Unit tests (QR/invite parsing, nickname filter, variant draw vs shared vectors, one question index over the real data)
        run: |
          npx tsx tools/join_link_test.ts && npx tsx tools/profanity_test.ts
          python3 tools/variant_vectors.py --check && npx tsx tools/variant_test.ts
          python3 tools/question_index.py --check && npx tsx tools/question_index_test.ts
      - name: Build (app type check + bundle)
        run: npm run build
      - name: Type check server functions
        run: npx tsc -p functions/tsconfig.json --noEmit
      - name: API suites on a local server
        run: bash tools/ci_local_server.sh auth_test admin_test classroom_test classroom_v2_test general_test topics_test profile_public_test quick_test photo_test pro_off_test security_test
      - name: Google / Apple sign-in suite
        run: pip install cryptography && python3 tools/oauth_test.py
      - name: Browsers for the walks
        run: |
          pip install playwright==1.64.0 pillow
          python -m playwright install --with-deps chromium webkit
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright as s;p=s().start();print(p.chromium.executable_path);p.stop()')" >> "$GITHUB_ENV"
      - name: Browser walks (profile, classroom, topic test, QR join, teacher–student and general tests on iPhone / small-phone WebKit, Pro flag off)
        run: SIM_OUT=/tmp/sim bash tools/ci_local_server.sh profile_e2e admin_flag_e2e classroom_e2e topics_e2e quick_e2e classroom_v2_e2e general_e2e pro_off_e2e premium_off_e2e attestation_off_e2e photos_e2e contrast_e2e layout_e2e states_e2e photo_ui_e2e design_e2e journey_e2e
      # Pro/Free ON: a second build (VITE_PRO_ENABLED=1) and a second server (PRO_ENABLED=1), run after every flag-off step above
      # because the helper rewrites .dev.vars. Covers the trial, one trial per person, the gates, the webhook, admin grants and the paywall.
      - name: Pro/Free with the flag on (API + browser)
        run: |
          VITE_PRO_ENABLED=1 npx vite build --outDir dist-pro --emptyOutDir
          PRO_ENABLED=1 DIST=dist-pro DE_PORT=8803 D1_PERSIST=.wrangler/state-pro bash tools/ci_local_server.sh pro_test pro_trial_test premium_test pro_e2e premium_e2e attestation_on_e2e design_pro_e2e journey_pro_e2e
      - name: Live site on a TV and slides in present mode
        run: python3 tools/present_test.py dist
      - name: Slide viewer auto page turning (fake clock)
        run: python3 tools/deck_auto_test.py dist
      - name: Education edition (Android / Google Play) has no patient role, dentist search, booking or patient records
        run: python3 tools/edu_edition_test.py dist
      - name: Every screen in uz/ru/en (offline build)
        run: npm run build:offline && python3 tools/package.py && PROTOTYPE_HTML=demo.html python3 tools/verify.py
      - name: Upload screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/sim
          if-no-files-found: ignore
